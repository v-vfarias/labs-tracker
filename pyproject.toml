[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labs-tracker"
version = "0.1.0"
description = "Local lab issue and PR validation tracker pilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyGithub>=2.4,<3",
  "pymongo>=4.8,<5",
  "python-dotenv>=1.0,<2",
  "nicegui>=2.2,<3",
  "pandas>=2.2,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
]

[project.scripts]
labs-tracker = "labs_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
